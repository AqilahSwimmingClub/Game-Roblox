# EDUVERSE — server + PostgreSQL (+ Redis opsional untuk banyak instance).
# Jalankan: cp .env.example .env  → isi JWT_SECRET, POSTGRES_PASSWORD, PUBLIC_URL → docker compose up -d --build
# HTTPS: letakkan reverse proxy (Caddy/Nginx) di depan port 3000 — lihat docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduverse
      POSTGRES_DB: eduverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduverse']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['scale'] # aktifkan dengan: docker compose --profile scale up -d

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://eduverse:${POSTGRES_PASSWORD}@db:5432/eduverse
      TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:3000:3000' # hanya untuk reverse proxy lokal; jangan buka langsung ke internet tanpa HTTPS

volumes:
  pgdata:
