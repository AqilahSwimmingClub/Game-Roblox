name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduverse
          POSTGRES_PASSWORD: eduverse
          POSTGRES_DB: eduverse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eduverse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://eduverse:eduverse@localhost:5432/eduverse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: eduverse-build
          path: |
            packages/shared/dist
            apps/server/dist
            apps/game/dist
            apps/dashboard/dist
          retention-days: 7

  e2e:
    name: E2E dua pemain + uji beban singkat
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduverse
          POSTGRES_PASSWORD: eduverse
          POSTGRES_DB: eduverse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eduverse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://eduverse:eduverse@localhost:5432/eduverse
      BASE_URL: http://localhost:3000
      TEACHER_EMAIL: guru-ci@sekolah.id
      TEACHER_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Jalankan server
        run: |
          (cd apps/server && nohup node dist/index.js > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: node tests/setup-teacher.mjs
      - run: node tests/e2e/two-players.mjs
        env:
          SHOTS: e2e-shots
      - run: node tests/load/bots.mjs --players 50,100 --duration 20
        env:
          OUT: loadtest-ci.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-hasil
          path: |
            e2e-shots
            loadtest-ci.json
            server.log
          retention-days: 7
